<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Your Orders - Joyful Treasures</title>
    <style type="text/css">

        body, h1, h2, h3, p, ul, li, table, th, td, button {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            font-family: 'Comic Sans MS', 'Chalkboard', cursive, sans-serif;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            padding: 10px 0;
        }
        .header-container img {
            width: 400px;
            height: auto;
        }
        nav {
            background: #91c4f6;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .nav-center {
            list-style-type: none;
            display: flex;
            flex-grow: 1;
            justify-content: center;
        }
        .nav-center li {
            margin: 0 15px;
        }
        .nav-center li a {
            color: #3f5964;
            text-decoration: none;
            padding: 10px 20px;
            display: block;
            transition: background-color 0.3s, color 0.3s;
            border: 2px solid transparent;
        }
        .nav-center li a:hover {
            background-color: #cfe4f5;
            color: #9ed2f0;
            border-radius: 5px;
        }
        .search-bar {
            display: flex;
            align-items: center;
            margin-right: 15px;
        }
        .search-bar input[type="text"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
        }
        .search-bar button {
            padding: 8px 15px;
            background-color: #ffffff;
            color: #3f5964;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }
        .search-bar button:hover {
            background-color: #ffb6c1;
            color: #ffffff;
        }
        .login-links a {
            margin-left: 10px;
            text-decoration: none;
            color: #3f5964;
            font-weight: bold;
            padding: 8px 12px;
            background-color: #ffffff;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }
        .login-links a:hover {
            background-color: #ffb6c1;
            color: #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background: #f2f2f2;
        }

        button.action-btn {
            padding: 8px 16px;
            font-size: 16px;
            background-color: #ec8dcb;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button.action-btn:hover {
            background-color: #d17abf;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #ccc;
            color: #666;
            margin-top: 40px;
        }
    </style>
    <script src="navigation.js?v=20261105-logo-align"></script>
    <link rel="stylesheet" href="orders.css?v=20261105-group2">
    <link rel="stylesheet" href="tag-search.css">
    <script src="tag-search.js"></script>
    <link rel="stylesheet" href="site-header.css?v=20261105-logo-align">
</head>
<body>

    <header>
        <div class="header-container">
            <img src="logo2.png" alt="Company Logo">
        </div>
        <nav>
            <ul class="nav-center">
                <li><a href="home.html">Home</a></li>
                <li><a href="product.html">Products</a></li>
                <li data-cart-nav><a href="cart.html">Cart</a></li>
                <li data-order-nav><a href="order.html">Order</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">FAQ</a></li>
            </ul>
            <div class="search-bar" data-tag-search>
                <input type="text" data-tag-input placeholder="Choose a tag..." aria-label="Search by tag" aria-expanded="false" autocomplete="off">
                <div class="tag-options" data-tag-options hidden></div>
            </div>
            <div class="login-links" id="loginLinks">
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>
        </nav>
    </header>

    <!-- Main Body -->
    <div class="container">
        <h1 style="text-align:center; margin-bottom:20px;">Your Orders</h1>
<p id="orderMessage" role="status" aria-live="polite">Loading orders...</p>
        <div id="orderGroups"></div>
    </div>


    <footer>
        <p>GroupCart · Multi-vendor shopping platform</p>
        <p>If you have any questions, please contact us on April 32, 2025</p>
    </footer>

<script src="orders.js?v=20261105-group2"></script>
</body>
</html>
