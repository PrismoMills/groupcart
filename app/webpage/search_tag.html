<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Tag Search - Online E-shop</title>
    <style type="text/css">

        body, h1, h2, h3, ul, li, p {
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffffff;
            font-family: 'Comic Sans MS', 'Chalkboard', cursive, sans-serif;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: #ffffff;
            padding: 10px 0;
        }
        .header-container img {
            width: 400px;
            height: auto;
        }

        nav {
            background: #91c4f6;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .nav-center {
            list-style-type: none;
            display: flex;
            flex-grow: 1;
            justify-content: center;
        }
        .nav-center li {
            margin: 0 15px;
        }
        .nav-center li a {
            color: #3f5964;
            text-decoration: none;
            padding: 10px 20px;
            display: block;
            transition: background-color 0.3s, color 0.3s;
            border: 2px solid transparent;
        }
        .nav-center li a:hover {
            background-color: #cfe4f5;
            color: #9ed2f0;
            border-radius: 5px;
        }
        /* General search bar: add drop-down suggestion function */
        .search-bar {
            display: flex;
            align-items: center;
            position: relative; /* Drop down menu absolute positioning */
            margin-right: 15px;
        }
        .search-bar input[type="text"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
            font-family: 'Comic Sans MS', 'Chalkboard', cursive, sans-serif;
        }
        .search-bar button {
            padding: 8px 15px;
            background-color: #ffffff;
            color: #3f5964;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            font-family: 'Comic Sans MS', 'Chalkboard', cursive, sans-serif;
        }
        .search-bar button:hover {
            background-color: #ffb6c1;
            color: #ffffff;
            border: 1px solid #ffffff;
        }
        /* Drop down suggestion menu */
        #searchSuggestions {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #ffffff;
            border: 1px solid #ccc;
            max-height: 150px;  /* Fixed display about 5 lines */
            overflow-y: auto;
            z-index: 1000;
        }
        #searchSuggestions div {
            padding: 5px 10px;
            cursor: pointer;
        }
        #searchSuggestions div:hover {
            background: #cfe4f5;
        }
        .login-links {
            margin-left: 10px;
        }
        .login-links a {
            text-decoration: none;
            color: #3f5964;
            font-weight: bold;
            padding: 8px 12px;
            background-color: #fcf9f6;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }
        .login-links a:hover {
            background-color: #ffb6c1;
            color: #ffffff;
        }
        /* Shared catalog layout is in catalog.css. */
        /* footer */
        footer {
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #ccc;
            color: #666;
        }
        footer p {
            margin: 0;
        }
        .center {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
    <script src="navigation.js?v=20261105-logo-align"></script>
    <link rel="stylesheet" href="tag-search.css">
    <script src="tag-search.js"></script>
    <link rel="stylesheet" href="site-header.css?v=20261105-logo-align">
    <link rel="stylesheet" href="catalog.css?v=20261105-compact-bar">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <img src="logo2.png" alt="Company Logo">
        </div>
        <nav>
            <ul class="nav-center">
                <li><a href="home.html">Home</a></li>
                <li><a href="product.html">Products</a></li>
                <li data-cart-nav><a href="cart.html">Cart</a></li>
                <li data-order-nav><a href="order.html">Order</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">FAQ</a></li>
            </ul>
            <div class="search-bar" data-tag-search>
                <input type="text" data-tag-input placeholder="Choose a tag..." aria-label="Search by tag" aria-expanded="false" autocomplete="off">
                <div class="tag-options" data-tag-options hidden></div>
            </div>
            <div class="login-links" id="loginLinks">
                <a href="login.html" id="loginLink">Login</a>
                <a href="register.html" id="registerLink">Register</a>
            </div>
        </nav>
    </header>

    <!-- Category menu (scroll horizontally) -->
    <div class="category-menu">
        <ul id="categoryMenu">
            <!-- The category menu items are dynamically generated by JavaScript -->
        </ul>
    </div>

    <!-- Page Title -->
    <div class="page-title">
        <h1 id="catalogTitle">Products for Sale</h1>
    </div>

    <!-- Product display area -->
    <div class="product-container" id="productContainer">
        <!-- The product will be dynamically generated by JavaScript -->
    </div>

    <!-- Paging navigation -->
    <div class="pagination" id="pagination">
        <!-- Paging button dynamic generation -->
    </div>

    <!-- The plus button is displayed only when the vendor logs in -->
    <button class="add-product-btn" id="addProductBtn" style="display: none;">+</button>

    <!-- footer -->
    <footer>
        <p style="text-align:center">GroupCart · Multi-vendor shopping platform</p>
    </footer>

    <script src="catalog.js?v=20261105-compact-bar"></script>
</body>
</html>
