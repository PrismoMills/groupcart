<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vendors</title>
    <style type="text/css">

        body, h1, h2, h3, p, ul, li, div, button {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            font-family: 'Comic Sans MS', 'Chalkboard', cursive, sans-serif;
        }
    
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            padding: 10px 0;
        }
        .header-container img {
            width: 400px;
            height: auto;
        }
        nav {
            background: #91c4f6;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .nav-center {
            list-style-type: none;
            display: flex;
            flex-grow: 1;
            justify-content: center;
        }
        .nav-center li {
            margin: 0 15px;
        }
        .nav-center li a {
            color: #3f5964;
            text-decoration: none;
            padding: 10px 20px;
            display: block;
            transition: background-color 0.3s, color 0.3s;
            border: 2px solid transparent;
        }
        .nav-center li a:hover {
            background-color: #cfe4f5;
            color: #9ed2f0;
            border-radius: 5px;
        }
        /* General search bar: add drop-down suggestion function */
        .search-bar {
            display: flex;
            align-items: center;
            position: relative; /* Drop down menu absolute positioning */
            margin-right: 15px;
        }
        .search-bar input[type="text"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
            font-family: 'Comic Sans MS', 'Chalkboard', cursive, sans-serif;
        }
        .search-bar button {
            padding: 8px 15px;
            background-color: #ffffff;
            color: #3f5964;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            font-family: 'Comic Sans MS', 'Chalkboard', cursive, sans-serif;
        }
        .search-bar button:hover {
            background-color: #ffb6c1;
            color: #ffffff;
            border: 1px solid #ffffff;
        }
        /* Drop down suggestion menu */
        #searchSuggestions {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #ffffff;
            border: 1px solid #ccc;
            max-height: 150px;  /* Fixed display about 5 lines */
            overflow-y: auto;
            z-index: 1000;
        }
        #searchSuggestions div {
            padding: 5px 10px;
            cursor: pointer;
        }
        #searchSuggestions div:hover {
            background: #cfe4f5;
        }
        .login-links a {
            margin-left: 10px;
            text-decoration: none;
            color: #3f5964;
            font-weight: bold;
            padding: 8px 12px;
            background-color: #ffffff;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }
        .login-links a:hover {
            background-color: #ffb6c1;
            color: #ffffff;
        }
 
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
   
        .vendor-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .vendor-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            width: 300px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            background-color: #f9f9f9;
        }
        .vendor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .vendor-card h2 {
            font-size: 22px;
            color: #333;
            margin-bottom: 10px;
        }
        .vendor-card p {
            font-size: 16px;
            color: #555;
            margin: 5px 0;
        }
        /* Vendor Management Button */
        .vendor-mgmt-btn {
            display: block;
            width: 200px;
            margin: 20px auto;
            padding: 10px 0;
            text-align: center;
            background-color: #ec8dcb;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s;
        }
        .vendor-mgmt-btn:hover {
            background-color: #d17abf;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #ccc;
            color: #666;
            margin-top: 40px;
        }
    </style>
    <script src="navigation.js?v=20261105-logo-align"></script>
    <link rel="stylesheet" href="tag-search.css">
    <script src="tag-search.js"></script>
    <link rel="stylesheet" href="site-header.css?v=20261105-logo-align">
</head>
<body>

    <header>
        <div class="header-container">
            <img src="logo2.png" alt="Company Logo">
        </div>
        <nav>
            <ul class="nav-center">
                <li><a href="home.html">Home</a></li>
                <li><a href="product.html">Products</a></li>
                <li data-cart-nav><a href="cart.html">Cart</a></li>
                <li data-order-nav><a href="order.html">Order</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">FAQ</a></li>
            </ul>
            <div class="search-bar" data-tag-search>
                <input type="text" data-tag-input placeholder="Choose a tag..." aria-label="Search by tag" aria-expanded="false" autocomplete="off">
                <div class="tag-options" data-tag-options hidden></div>
            </div>
            <div class="login-links" id="loginLinks">
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>
        </nav>
    </header>
    
    <!-- main content -->
    <div class="container">
        <h1 style="text-align:center; margin-bottom:20px;">Our Vendors</h1>
        <!-- Vendor Management Jumping button -->
        <button class="vendor-mgmt-btn" onclick="window.location.href='vendor_management.html'">
            Vendor Management
        </button>
        <div class="vendor-container" id="vendorContainer">
            <!-- Vendor information will be dynamically inserted here -->
        </div>
    </div>
    

    <footer>
        <p>GroupCart · Multi-vendor shopping platform</p>
    </footer>

</body>
</html>
<script>
    // Login status detection and logout function
    document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('isRegistered') === 'true') {
                const loginLinksDiv = document.getElementById('loginLinks');
                if (loginLinksDiv) {
                    loginLinksDiv.innerHTML = '<a href="#" id="logoutLink">Log Out</a>';
                    document.getElementById('logoutLink').addEventListener('click', function() {
                        localStorage.removeItem('isRegistered');
                        localStorage.removeItem('CustomerID');
                        localStorage.removeItem('VendorID');
                        localStorage.removeItem('userType');
                        alert("You have been logged out.");
                        window.location.href = "home.html";
                    });
                }
            }
        // Initialize search dropdown function: This function is a universal search code, which can be directly copied for the next reference
            initSearchDropdown();
        });
        // Universal search dropdown function
        function initSearchDropdown() { window.initTagSearch(); }
    async function loadVendors() {
        try {
            const response = await fetch('http://localhost:5000/api/vendors');  // data interface offered by Python Flask
            const vendors = await response.json();
            const container = document.getElementById('vendorContainer');
            container.innerHTML = "";
            vendors.forEach(vendor => {
                const card = document.createElement('div');
                card.className = 'vendor-card';
                card.innerHTML = `
                    <h2>${vendor.BusinessName}</h2>
                    <p><strong>ID:</strong> ${vendor.VendorID}</p>
                    <p><strong>Feedback:</strong> ⭐${vendor.CustomerFeedbackScore}</p>
                    <p><strong>Location:</strong> ${vendor.GeographicalPresence}</p>
                `;
                container.appendChild(card);
            });
        } catch (error) {
            console.error("Failed to load vendors:", error);
        }
    }

    document.addEventListener('DOMContentLoaded', loadVendors);
</script>
