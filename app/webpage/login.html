<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login</title>
    <style type="text/css">

        body, h1, h2, p, ul, li, form, input, button {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            font-family: 'Comic Sans MS', 'Chalkboard', cursive, sans-serif;
        }
   
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            padding: 10px 0;
        }
        .header-container img {
            width: 400px;
            height: auto;
        }
        nav {
            background: #91c4f6;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .nav-center {
            list-style-type: none;
            display: flex;
            flex-grow: 1;
            justify-content: center;
        }
        .nav-center li {
            margin: 0 15px;
        }
        .nav-center li a {
            color: #3f5964;
            text-decoration: none;
            padding: 10px 20px;
            display: block;
            transition: background-color 0.3s, color 0.3s;
            border: 2px solid transparent;
        }
        .nav-center li a:hover {
            background-color: #cfe4f5;
            color: #9ed2f0;
            border-radius: 5px;
        }
        .login-links a {
            margin-left: 10px;
            text-decoration: none;
            color: #3f5964;
            font-weight: bold;
            padding: 8px 12px;
            background-color: #ffffff;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }
        .login-links a:hover {
            background-color: #ffb6c1;
            color: #ffffff;
        }
        /* Body container */
        .container {
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        /* login form */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        form label {
            font-size: 18px;
            color: #333;
        }
        form input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        form button {
            padding: 10px;
            font-size: 18px;
            background-color: #ec8dcb;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        form button:hover {
            background-color: #d17abf;
        }
        /* Prompt for registration link */
        .register-link {
            text-align: center;
            margin-top: 10px;
            font-size: 16px;
        }
        .register-link a {
            color: #3f5964;
            text-decoration: none;
            font-weight: bold;
        }
        .register-link a:hover {
            color: #9ed2f0;
        }
        /* footer */
        footer {
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #ccc;
            color: #666;
            margin-top: 40px;
        }
    </style>
    <script src="navigation.js?v=20261105-logo-align"></script>
    <link rel="stylesheet" href="site-header.css?v=20261105-logo-align">
</head>
<body>
    <!-- Head and navigation bar -->
    <header>
        <div class="header-container">
            <img src="logo2.png" alt="Company Logo">
        </div>
        <nav>
            <ul class="nav-center">
                <li><a href="home.html">Home</a></li>
                <li><a href="product.html">Products</a></li>
                <li data-cart-nav><a href="cart.html">Cart</a></li>
                <li data-order-nav><a href="order.html">Order</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">FAQ</a></li>
            </ul>
            <div class="login-links">
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>
        </nav>
    </header>
    
    <!-- login form -->
    <div class="container">
        <h1 style="text-align:center; margin-bottom:20px;">Login</h1>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <label for="CustomerID">CustomerID:</label>
            <input type="text" id="CustomerID" placeholder="Enter your CustomerID" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter your password" required>
            
            <button type="submit">Login</button>
        </form>
        <div class="register-link">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>
    
    <!-- footer -->
    <footer>
        <p>GroupCart · Multi-vendor shopping platform</p>
    </footer>
    
    <script>
        function handleLogin(event) {
    event.preventDefault();
    const customerID = document.getElementById('CustomerID').value.trim();
    const password = document.getElementById('password').value;

    fetch('http://localhost:5000/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerID: customerID, password: password })
    })
    .then(response => response.json().then(data => ({ status: response.status, body: data })))
    .then(({ status, body }) => {
        if (status === 200) {
            // Login successful: save user information and jump
            localStorage.setItem('isRegistered', 'true');
            // Save the corresponding ID according to the returned UserType
            if(body.userType === 'customer'){
                localStorage.setItem('CustomerID', body.customerID);
            } else if(body.userType === 'vendor'){
                localStorage.setItem('VendorID', body.vendorID);
            }
            localStorage.setItem('userType', body.userType);
            alert("Login successful!");
            window.location.href = "home.html";
        } else {
            // Determine the error type according to the returned message
            if(body.message.includes("Invalid credentials")) {
                // If it can be further distinguished, it can be determined by the specific prompt returned by the back end
                alert("The account number or password was entered incorrectly.");
            } else if(body.message.includes("not found")) {
                alert("Account not registered, please register first.");
                window.location.href = "register.html";
            } else {
                alert("Login failed: " + body.message);
            }
        }
    })
    .catch(error => {
        console.error("Error during login:", error);
        alert("There was an error logging in, please try again later.");
    });
}

    </script>
</body>
</html>
